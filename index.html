<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0" />
<title>김재원 · 이예지 결혼합니다</title>
<meta name="description" content="김재원, 이예지 결혼식에 초대합니다. 2026.10.17 (토) 오후 5시 20분, 까사그랑데" />
<meta name="robots" content="noindex, nofollow" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Song+Myung&family=Cormorant+Garamond:wght@400;500;600&display=swap"
  rel="stylesheet"
/>
<link rel="stylesheet" href="css/style.css?v=20260823c" />
</head>
<body>
  <!-- 인트로 영상 -->
  <div class="intro-overlay" id="intro-overlay">
    <video
      class="intro-video"
      id="intro-video"
      src="videos/intro.mp4?v=20260819a"
      autoplay
      muted
      playsinline
      preload="auto"
    ></video>
    <button type="button" class="intro-play" id="intro-play" hidden aria-label="재생">▶</button>
    <button type="button" class="intro-unmute" id="intro-unmute" aria-label="소리 켜기">🔊</button>
    <button type="button" class="intro-skip" id="intro-skip">건너뛰기</button>
  </div>

  <div class="scroll-progress" id="scroll-progress" aria-hidden="true"></div>

  <!-- 1. 표지 -->
  <section id="cover" class="section cover">
    <div class="cover-image" id="cover-image"></div>
    <div class="cover-overlay"></div>
    <div class="cover-content">
      <p class="cover-eyebrow">청첩장</p>
      <h1 class="cover-names" id="cover-names"></h1>
      <p class="cover-date" id="cover-date"></p>
    </div>
    <div class="scroll-cue" aria-hidden="true">↓</div>
  </section>

  <!-- 2. 인사말 -->
  <section id="greeting" class="section greeting">
    <p class="section-label" data-reveal>인사말</p>
    <div class="greeting-text" id="greeting-text"></div>
    <div class="greeting-parents" id="greeting-parents" data-reveal></div>
    <div class="greeting-names" id="greeting-names" data-reveal></div>
  </section>

  <!-- 3. 예식 안내 + 오시는 길 -->
  <section id="info" class="section info">
    <p class="section-label" data-reveal>예식 안내</p>
    <p class="info-datetime" id="info-datetime" data-reveal></p>

    <div class="calendar-card" id="calendar-card" data-reveal></div>

    <p class="info-venue" id="info-venue" data-reveal></p>
    <p class="info-address" id="info-address" data-reveal></p>

    <div class="map-embed" id="map-embed" data-reveal></div>

    <div class="map-buttons" id="map-buttons" data-reveal></div>

    <div class="directions" id="directions" data-reveal></div>
  </section>

  <!-- 4. 갤러리 -->
  <section id="gallery" class="section gallery">
    <p class="section-label" data-reveal>갤러리</p>
    <div class="gallery-grid" id="gallery-grid"></div>
  </section>

  <!-- 5. 참석의사 전달하기 -->
  <section id="rsvp" class="section rsvp">
    <p class="section-label" data-reveal>참석 안내</p>
    <p class="rsvp-intro" data-reveal>참석 여부를 알려주시면 준비에 큰 도움이 됩니다.</p>
    <form class="rsvp-form" id="rsvp-form" data-reveal>
      <input type="text" name="name" placeholder="이름" required />
      <div class="rsvp-radio-group">
        <label><input type="radio" name="attending" value="yes" checked /> 참석</label>
        <label><input type="radio" name="attending" value="no" /> 불참</label>
      </div>
      <input type="number" name="guestCount" min="1" value="1" aria-label="참석 인원" />
      <select name="meal" aria-label="식사 여부">
        <option value="">식사 여부 (선택)</option>
        <option value="yes">식사 예정</option>
        <option value="no">식사 안 함</option>
      </select>
      <button type="submit">참석 의사 전달하기</button>
    </form>
  </section>

  <!-- 6. 연락처 -->
  <section id="contact" class="section contact">
    <p class="section-label" data-reveal>연락처</p>
    <div class="contact-list" id="contact-list"></div>
  </section>

  <!-- 7. 방명록 -->
  <section id="guestbook" class="section guestbook">
    <p class="section-label" data-reveal>방명록</p>
    <form class="guestbook-form" id="guestbook-form" data-reveal>
      <input type="text" name="name" placeholder="이름" required />
      <textarea name="message" placeholder="축하 메시지를 남겨주세요" required></textarea>
      <button type="submit">메시지 남기기</button>
    </form>
    <div class="guestbook-list" id="guestbook-list"></div>
  </section>

  <!-- 8. 마음 전하실 곳 (계좌) -->
  <section id="accounts" class="section accounts">
    <p class="section-label" data-reveal>마음 전하실 곳</p>
    <div class="contact-list" id="account-side-list"></div>
  </section>

  <!-- 9. 공유하기 -->
  <section id="share" class="section share">
    <p class="section-label" data-reveal>공유하기</p>
    <div class="share-buttons" id="share-buttons" data-reveal>
      <button type="button" class="share-btn" id="copy-link-btn">청첩장 링크 복사</button>
      <button type="button" class="share-btn kakao" id="kakao-share-btn" hidden>카카오톡으로 공유</button>
    </div>
  </section>

  <footer class="footer">
    <p id="footer-names">🩷</p>
  </footer>

  <!-- 라이트박스 -->
  <div class="lightbox" id="lightbox" hidden>
    <button type="button" class="lightbox-close" id="lightbox-close" aria-label="닫기">✕</button>
    <button type="button" class="lightbox-prev" id="lightbox-prev" aria-label="이전 사진">‹</button>
    <img class="lightbox-image" id="lightbox-image" alt="" />
    <button type="button" class="lightbox-next" id="lightbox-next" aria-label="다음 사진">›</button>
  </div>

  <!-- 연락처 모달 -->
  <div class="contact-modal" id="contact-modal" hidden>
    <div class="contact-modal-panel">
      <button type="button" class="contact-modal-close" id="contact-modal-close" aria-label="닫기">✕</button>
      <h3 class="contact-modal-title" id="contact-modal-title"></h3>
      <div class="contact-modal-list" id="contact-modal-list"></div>
    </div>
  </div>

  <!-- 계좌 모달 -->
  <div class="contact-modal" id="account-modal" hidden>
    <div class="contact-modal-panel">
      <button type="button" class="contact-modal-close" id="account-modal-close" aria-label="닫기">✕</button>
      <h3 class="contact-modal-title" id="account-modal-title"></h3>
      <p class="accounts-intro" id="account-modal-intro"></p>
      <div class="contact-modal-list" id="account-modal-list"></div>
    </div>
  </div>

  <!-- 복사 완료 토스트 -->
  <div class="toast" id="toast" hidden></div>

  <script src="https://t1.kakaocdn.net/kakao_js_sdk/2.8.1/kakao.min.js"></script>
  <script type="module" src="js/main.js?v=20260823c"></script>
</body>
</html>
